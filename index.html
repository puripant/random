<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randomizer 🎲</title>
    <style>
        body {
            font-family: Arial, sans-serif; 
            font-size: 20px;
            text-align: center;
        }
        #input { 
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        input {
            width: 80%;
            max-width: 640px;
        }
        input, button {
            font-size: 1em;
        }
        .title-with-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1em;
        }
        #modeToggle {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0;
        }
        #modeToggle:hover {
            transform: scale(1.2);
        }
        #list { 
            list-style: none;
            width: 100%;
            max-width: 800px;
            margin: 1em auto;
            padding: 0;
            display: none;
        }
        #list.active {
            display: block;
        }
        .listItem {
            display: flex;
            justify-content: space-between;
            padding: 0.5em 0.75em 0.5em 0.5em;
            margin: 0.5em auto;
            background: #f0f0f0;
            border-radius: 10px;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        .listItem button {
            font-size: 0.5em;
        }
        .highlight { 
            background: gold; 
        }
        #cardContainer {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 1em auto;
            padding: 2em 1em;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5em;
            justify-items: center;
        }
        #cardContainer.active {
            display: grid;
        }
        .card {
            width: 150px;
            height: 210px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            padding: 1em;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .card-front {
            background: #e8e8e8;
            color: #333;
            font-size: 4em;
        }
        .card-back {
            background: gold;
            color: #333;
            transform: rotateY(180deg);
            word-wrap: break-word;
            border: 1px solid #ddd;
        }
        .card.revealed {
            border: 4px solid black;
            border-radius: 15px;
        }
        #clearCardsBtn {
            display: none;
        }
        #clearCardsBtn.active {
            display: inline-block;
        }
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }
        #popup.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #popupContent {
            background: white;
            border-radius: 20px;
            padding: 3em;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out, bounce 0.6s ease-out;
            max-width: 80%;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        #popupText {
            font-size: 3em;
            font-weight: bold;
            margin: 0.5em 0;
            color: #333;
        }
        #randomizeBtn {
            font-size: 2em;
            padding: 0.5em 1em;
            margin-top: 1em;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: transform 0.2s;
        }
        #randomizeBtn:hover {
            transform: scale(1.1);
        }
        #randomizeBtn:active {
            transform: scale(0.95);
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="title-with-toggle">
        <h2>Randomizer</h2>
        <button id="modeToggle" onclick="toggleMode()">🎲</button>
    </div>
    <div id="input">
        <input type="text" id="textInput" placeholder="Enter text">
        <button onclick="add()">➕</button>
        <button id="randomizeListBtn" onclick="randomize()">🎲</button>
        <button id="clearCardsBtn" onclick="clearAllCards()">🗑️</button>
    </div>
    <ul id="list" class="active"></ul>
    <div id="cardContainer"></div>
    
    <div id="popup">
        <div id="popupContent">
            <div id="popupText"></div>
            <button id="randomizeBtn" onclick="randomizeAgain()">🎲</button>
        </div>
    </div>
    
    <script>
        const list = document.getElementById("list");
        const textInput = document.getElementById("textInput");
        const popup = document.getElementById("popup");
        const popupText = document.getElementById("popupText");
        const cardContainer = document.getElementById("cardContainer");
        const modeToggle = document.getElementById("modeToggle");
        const randomizeListBtn = document.getElementById("randomizeListBtn");
        const clearCardsBtn = document.getElementById("clearCardsBtn");
        
        let isCardMode = false;
        let cardValues = []; // Array of card values in current order
        let lastRevealedCardIndex = null;
        
        textInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                add();
            }
        });
        
        function toggleMode() {
            isCardMode = !isCardMode;
            modeToggle.textContent = isCardMode ? "🃏" : "🎲";
            list.classList.toggle("active");
            cardContainer.classList.toggle("active");
            randomizeListBtn.style.display = isCardMode ? "none" : "inline-block";
            clearCardsBtn.classList.toggle("active");
            
            // Clear all items when switching modes
            list.innerHTML = "";
            cardContainer.innerHTML = "";
            cardValues = [];
            lastRevealedCardIndex = null;
        }
        
        function add() {
            const text = textInput.value.trim();
            if (!text) return;

            if (isCardMode) {
                addCard(text);
            } else {
                addListItem(text);
            }

            textInput.value = "";
        }
        
        function addListItem(text) {
            const li = document.createElement("li");
            li.className = "listItem";
            li.innerHTML = `${text} <button onclick="removeListItem(this.parentElement)">❌</button>`;
            list.appendChild(li);
        }
        
        function addCard(text) {
            cardValues.push(text);
            shuffleCards();
        }
        
        function shuffleCards() {
            // Fisher-Yates shuffle
            for (let i = cardValues.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardValues[i], cardValues[j]] = [cardValues[j], cardValues[i]];
            }
            renderCards();
        }
        
        function renderCards() {
            cardContainer.innerHTML = "";
            cardValues.forEach((value, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.dataset.value = value;
                card.dataset.index = index;
                if (lastRevealedCardIndex === index) {
                    card.classList.add("revealed");
                }
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">🃏</div>
                        <div class="card-face card-back"></div>
                    </div>
                `;
                
                card.addEventListener("click", function(e) {
                    if (this.classList.contains("flipped")) {
                        return; // Prevent flipping back
                    }
                    this.classList.add("flipped");
                    this.querySelector(".card-back").textContent = this.dataset.value;
                    lastRevealedCardIndex = parseInt(this.dataset.index);
                    updateCardBorders();
                    showCardRevealFanfare(this.dataset.value);
                });
                
                cardContainer.appendChild(card);
            });
        }
        
        function updateCardBorders() {
            document.querySelectorAll(".card").forEach(card => {
                card.classList.remove("revealed");
                if (parseInt(card.dataset.index) === lastRevealedCardIndex) {
                    card.classList.add("revealed");
                }
            });
        }
        
        function removeListItem(li) {
            li.style.transform = "translateY(-20px)";
            li.style.opacity = "0";
            setTimeout(() => li.remove(), 500);
        }
        
        function clearAllCards() {
            cardContainer.innerHTML = "";
            cardValues = [];
            lastRevealedCardIndex = null;
        }
        
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * 100 + "%";
                confetti.style.top = "-10px";
                confetti.style.background = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#FFA502", "#FFD93D"][Math.floor(Math.random() * 5)];
                confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
                
                const duration = 2 + Math.random() * 1;
                const xOffset = (Math.random() - 0.5) * 200;
                
                confetti.animate([
                    { transform: `translateY(0) translateX(0)`, opacity: 1 },
                    { transform: `translateY(${window.innerHeight}px) translateX(${xOffset}px)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: "cubic-bezier(0.25, 0.46, 0.45, 0.94)"
                });
                
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }
        
        function randomize() {
            const items = document.querySelectorAll(".listItem");
            if (items.length === 0) return;
            
            let index = 0;
            let iterations = items.length * 5 + Math.floor(Math.random() * items.length);
            let speed = 50;
            const finalIndex = Math.floor(Math.random() * items.length);
            
            function cycle() {
                items.forEach(item => item.classList.remove("highlight"));
                items[index].classList.add("highlight");
                if (iterations-- > 0) {
                    speed = Math.min(200, speed + 10);
                    setTimeout(cycle, speed);
                    index = (index + 1) % items.length;
                } else {
                    const selectedItem = items[finalIndex];
                    const selectedText = selectedItem.textContent.trim().replace("❌", "").trim();
                    showPopup(selectedText, selectedItem);
                }
            }
            cycle();
        }
        
        function showCardRevealFanfare(text) {
            createConfetti();
        }
        
        popup.addEventListener("click", function(e) {
            if (e.target === popup) {
                popup.classList.remove("show");
            }
        });
        
        function showPopup(text, itemElement) {
            popupText.textContent = text;
            const items = document.querySelectorAll(".listItem");
            items.forEach(item => item.classList.remove("highlight"));
            popup.classList.add("show");
            createConfetti();
            removeListItem(itemElement);
        }
    </script>
</body>
</html>
